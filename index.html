<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Only Corporate Travel | Corporate Travel, MICE & Events</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #ffffff;
    color: #172033;
    line-height: 1.6;
}

header {
    background: #ffffff;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: #14213d;
}

.logo span {
    color: #e63946;
}

nav {
    display: flex;
    gap: 28px;
    align-items: center;
}

nav a {
    text-decoration: none;
    color: #172033;
    font-weight: 600;
}

nav a:hover {
    color: #e63946;
}

.hero {
    min-height: 620px;
    background: linear-gradient(rgba(10,25,50,0.72), rgba(10,25,50,0.72)),
    url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1800&q=80");
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    padding: 80px 7%;
    color: white;
}

.hero-content {
    max-width: 720px;
}

.hero h1 {
    font-size: 58px;
    line-height: 1.1;
    margin-bottom: 22px;
}

.hero h1 span {
    color: #f4b942;
}

.hero p {
    font-size: 21px;
    margin-bottom: 30px;
    color: #f1f1f1;
}

.btn {
    display: inline-block;
    padding: 14px 28px;
    background: #e63946;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

.btn:hover {
    background: #c92f3b;
}

section {
    padding: 80px 7%;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 38px;
    color: #14213d;
}

.section-title p {
    color: #667085;
    margin-top: 10px;
}

.services {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.service-card {
    background: white;
    padding: 35px 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.service-card:hover {
    transform: translateY(-8px);
}

.icon {
    font-size: 45px;
    margin-bottom: 18px;
}

.service-card h3 {
    color: #14213d;
    margin-bottom: 12px;
}

.service-card p {
    color: #667085;
}

.about {
    background: #f5f7fa;
    text-align: center;
}

.about-content {
    max-width: 850px;
    margin: auto;
}

.about-content p {
    font-size: 18px;
    color: #555;
}

.contact {
    background: #14213d;
    color: white;
    text-align: center;
}

.contact h2 {
    font-size: 38px;
    margin-bottom: 15px;
}

.contact p {
    margin-bottom: 25px;
}

footer {
    background: #0b1325;
    color: #b8c0ce;
    text-align: center;
    padding: 25px;
}
